<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
  <title>Camera</title>
  
  <!-- PWA 設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- A-Frame 與 MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- iOS 26 液態玻璃相機 UI -->
  <div id="camera-ui">
    
    <!-- 頂部：懸浮式液態玻璃工具列 -->
    <div class="top-bar-floating liquid-glass">
      <div class="control-icon">⚡️</div>
      <div class="control-icon">HDR</div>
      <!-- iOS 26 簡約風狀態指示器 -->
      <span class="magic-indicator" id="magic-status">MAGIC ACTIVE</span>
      <div class="control-icon">⊙</div>
    </div>
    
    <!-- 中央視圖與變焦氣泡 -->
    <div class="viewport-area">
      <!-- 1x 變焦氣泡也採用液態玻璃懸浮樣式 -->
      <div class="zoom-bubble-floating liquid-glass">1x</div>
    </div>

    <!-- 底部：懸浮式液態玻璃控制面板 -->
    <div class="bottom-dock-floating liquid-glass">
      <!-- 簡約模式選擇 -->
      <div class="modes-slider">
        <div class="modes-track">
          <span class="mode-item">VIDEO</span>
          <span class="mode-item active">PHOTO</span>
          <span class="mode-item">PORTRAIT</span>
        </div>
      </div>

      <!-- 快門與快速按鍵列 -->
      <div class="controls-row">
        <!-- 左：液態玻璃相簿縮圖 -->
        <div class="gallery-thumbnail liquid-glass" style="background-image: url('icon-192.png');"></div>
        
        <!-- 中：雙環液態玻璃快門 -->
        <div class="shutter-outer-ios26" id="shutter-btn">
          <div class="shutter-inner-ios26"></div>
        </div>
        
        <!-- 右：鏡頭切換鈕 -->
        <div class="flip-button-ios26 liquid-glass">🔄</div>
      </div>
    </div>
  </div>

  <!-- AR 渲染區域 -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: no;" 
    embedded 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights: true" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false"
  >
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- 撲克牌追蹤實體 -->
    <a-entity id="card-target" mindar-image-target="targetIndex: 0">
      <!-- 虛擬疊加牌面 (轉換後的新牌) -->
      <a-image id="magic-card-overlay" src="./new_card.png" position="0 0 0" height="1.4" width="1" rotation="0 0 0" visible="true"></a-image>
    </a-entity>
  </a-scene>

  <script src="app.js"></script>
</body>
</html>
