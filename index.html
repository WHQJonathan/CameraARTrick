<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
  <title>Camera</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- A-Frame 1.4.2 + MindAR 1.2.5 (iOS 最佳穩定拍檔) -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 手動啟動相機解鎖層（解決 iOS 系統低電量或自動播放攔截） -->
  <div id="ios-camera-unlocker">
    <div class="unlock-text">若畫面全黑，請點擊螢幕任意處啟用相機</div>
  </div>

  <!-- 頂部與底部 100% 擬真 iOS 相機 UI -->
  <div id="camera-ui">
    
    <!-- 1. 頂部狀態列 (綠色使用中指示點) -->
    <div class="ios-status-indicator">
      <div class="recording-dot"></div>
    </div>

    <!-- 2. 中央觀景窗疊加層 -->
    <div class="viewport-overlay">
      <!-- 頂部右側懸浮控制膠囊 -->
      <div class="top-floating-pill">
        <span class="pill-icon">⚡️<sub style="font-size: 8px;">A</sub></span>
        <span class="pill-icon active-yellow">◎</span>
        <span class="pill-icon">⁙</span>
      </div>

      <!-- 左側小黃花微距按鈕 -->
      <div class="macro-button">
        <span class="macro-icon">🌷</span>
      </div>

      <!-- 水平變焦按鈕列 (.5, 1x, 2, 4, 8) -->
      <div class="zoom-row">
        <span class="zoom-dot">.5</span>
        <span class="zoom-dot active">1x</span>
        <span class="zoom-dot">2</span>
        <span class="zoom-dot">4</span>
        <span class="zoom-dot">8</span>
      </div>
    </div>

    <!-- 3. 底部黑色面板 (遮罩快門與控制列) -->
    <div class="bottom-panel-ios">
      
      <!-- 快門按鈕列 -->
      <div class="shutter-row">
        <div class="ios-shutter-container" id="shutter-btn">
          <div class="ios-shutter-inner"></div>
        </div>
      </div>

      <!-- 底部控制列：縮圖、錄影/拍照、翻轉按鈕 -->
      <div class="dock-row">
        <!-- 左：相簿轉盤縮圖 -->
        <div class="lens-dial">
          <div class="dial-thumb" style="background-image: url('icon-192.png');"></div>
        </div>

        <!-- 中：錄影 / 拍照 黑色圓角膠囊 -->
        <div class="modes-pill">
          <span class="mode-item">錄影</span>
          <span class="mode-item active" id="magic-status">拍照</span>
        </div>

        <!-- 右：鏡頭切換鈕 -->
        <div class="flip-button">
          <span>🔄</span>
        </div>
      </div>

    </div>
  </div>

  <!-- AR 場景 (將預設背景強制關閉，確保底層視訊能完全透出) imageTargetSrc: ./targets.mind-->
  <a-scene 
    mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/WHQJonathan/CameraARTrick@main/targets.mind;; autoStart: true; uiLoading: no; uiError: no; uiScanning: no;" 
    
    embedded 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights: true" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false"
  >
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="card-target" mindar-image-target="targetIndex: 0">
      <a-image id="magic-card-overlay" src="./new_card.png" position="0 0 0" height="1.4" width="1" rotation="0 0 0" visible="true"></a-image>
    </a-entity>
  </a-scene>

  <script src="app.js"></script>
</body>
</html>
