<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
  <title>Camera</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-192.png">

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 手動啟動相機解鎖層 -->
  <div id="ios-camera-unlocker">
    <div class="unlock-text">若畫面全黑，請點擊螢幕任意處啟用相機</div>
  </div>

  <!-- iOS 仿真相機介面 -->
  <div id="camera-ui">
    <div class="top-black-bar">
      <div class="recording-dot"></div>
      <div class="top-floating-pill">
        <span class="pill-icon">⚡️<sub style="font-size: 8px;">A</sub></span>
        <span class="pill-icon active-yellow">◎</span>
        <span class="pill-icon">⁙</span>
      </div>
    </div>

    <div class="viewfinder-viewport">
      <div class="macro-button">
        <span class="macro-icon">🌷</span>
      </div>
      <div class="zoom-row">
        <span class="zoom-dot">.5</span>
        <span class="zoom-dot active">1x</span>
        <span class="zoom-dot">2</span>
        <span class="zoom-dot">4</span>
        <span class="zoom-dot">8</span>
      </div>
    </div>

    <div class="bottom-panel-ios">
      <div class="shutter-row">
        <div class="ios-shutter-container" id="shutter-btn">
          <div class="ios-shutter-inner"></div>
        </div>
      </div>
      <div class="dock-row">
        <div class="lens-dial">
          <span style="font-size: 8px; transform: scale(0.85); opacity: 0.8;">父 漲</span>
          <span class="dial-red">0.00</span>
        </div>
        <div class="modes-pill">
          <span class="mode-item">錄影</span>
          <span class="mode-item active" id="magic-status">拍照</span>
        </div>
        <div class="flip-button" id="flip-camera-btn">
          <span>🔄</span>
        </div>
      </div>
    </div>
  </div>

<!-- AR 場景 (已加入極限防抖參數) -->
    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; filterMinCF: 0.0001; filterBeta: 0.001; missTolerance: 15; uiLoading: no; uiError: no; uiScanning: no;" 
        embedded 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights: true" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false"
        light-estimator
        >
        <a-assets>
        <img id="clubs5-mask-texture" src="./clubs_5_mask.png"> 
        <img id="clubs5-normal" src="./clubs_5_normal.png"> 
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-light id="ambient-light" type="ambient" color="#ffffff" intensity="0.8"></a-light>
        <a-light id="dir-light" type="directional" position="1 3 1" color="#ffffff" intensity="1.2"></a-light>

        <a-entity id="card-target" mindar-image-target="targetIndex: 0">
        <a-entity 
            id="magic-card-overlay"
            geometry="primitive: plane; width: 1.15; height: 1.4" 
            material="shader: standard; src: #clubs5-mask-texture; normalMap: #clubs5-normal; normalScale: 0.1 0.1; roughness: 0.28; metalness: 0.08; transparent: true; alphaTest: 0.5;"
            position="0 -0.35 0" 
            rotation="0 0 0"
            scale="1 1 1"
            visible="true"
        ></a-entity>
        </a-entity>
    </a-scene>
    <!-- 引入紋理資源與法線貼圖 -->
    <a-assets>
        <!-- 這張貼圖必須是：背景透明、在紅心8位置有白色色塊、在梅花5位置有黑色梅花圖案的 PNG 檔 -->
        <img id="clubs5-mask-texture" src="./clubs_5_mask.png"> 
        <img id="clubs5-normal" src="./clubs_5_normal.png"> 
      </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- PBR 物理光影所需的光源：包含環境光與主方向光（模擬天花板燈光） -->
    <a-light id="ambient-light" type="ambient" color="#ffffff" intensity="0.8"></a-light>
    <a-light id="dir-light" type="directional" position="1 3 1" color="#ffffff" intensity="1.2"></a-light>

    <!-- 撲克牌追蹤實體 -->
        <!-- 假設您的 targets.mind 是使用「上半張牌」的照片進行編譯訓練 -->
        <a-entity id="card-target" mindar-image-target="targetIndex: 0">
        
            <!-- 
            【修正重點】：
            1. src 更換為您自製的「透明底色、帶白色抹除塊與黑色梅花5符號」的 PNG 貼圖。
            2. 由於追蹤點在「上半張牌」，我們透過 position 屬性將虛擬貼圖往下位移，使其對齊整張實體牌。
                💡 微調指南：
                - position="[左右X] [上下Y] [前後Z]"
                - 如果梅花 5 偏高，請將第二個數字調小（例如改成 -0.38 或 -0.4）。
                - 如果梅花 5 偏低，請將第二個數字調大（例如改成 -0.3 或 -0.25）。
            -->
            <a-entity 
            id="magic-card-overlay"
            geometry="primitive: plane; width: 1.15; height: 1.4" 
            material="shader: standard; src: #clubs5-mask-texture; normalMap: #clubs5-normal; normalScale: 0.1 0.1; roughness: 0.28; metalness: 0.08; transparent: true; alphaTest: 0.5;"
            position="0 -0.35 0" 
            rotation="0 0 0"
            scale="0.9 1 1"
            visible="true"
            ></a-entity>
        </a-entity>
  </a-scene>

  <script src="app.js"></script>
</body>
</html>
