<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
  <title>Camera</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- A-Frame 1.4.2 + MindAR 1.2.5 -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 手動啟動相機解鎖層 -->
  <div id="ios-camera-unlocker">
    <div class="unlock-text">若畫面全黑，請點擊螢幕任意處啟用相機</div>
  </div>

  <!-- iOS 仿真相機介面 -->
  <div id="camera-ui">
    
    <!-- 1. 頂部黑色 Bar -->
    <div class="top-black-bar">
      <div class="recording-dot"></div>
      
      <!-- 頂部右側懸浮控制膠囊 -->
      <div class="top-floating-pill">
        <span class="pill-icon">⚡️<sub style="font-size: 8px;">A</sub></span>
        <span class="pill-icon active-yellow">◎</span>
        <!-- ⭐️ 秘密校準開關：點選 ⁙ 即可打開/關閉手動對齊面板 -->
        <span class="pill-icon" id="open-cal-btn" style="cursor: pointer;">⁙</span>
      </div>
    </div>

    <!-- ⭐️ 新增：秘密對齊校準面板 ⭐️ -->
    <div id="calibration-panel" class="hidden">
      <h3>🔧 變牌對齊手動校準</h3>
      
      <div class="cal-control">
        <label>左右位移 (X): <span id="val-x">0</span></label>
        <input type="range" id="cal-x" min="-0.4" max="0.4" step="0.005" value="0">
      </div>
      
      <div class="cal-control">
        <label>上下位移 (Y): <span id="val-y">-0.35</span></label>
        <input type="range" id="cal-y" min="-1.0" max="0.2" step="0.005" value="-0.35">
      </div>
      
      <div class="cal-control">
        <label>卡牌寬度 (Scale X): <span id="val-sx">1.0</span></label>
        <input type="range" id="cal-sx" min="0.5" max="1.8" step="0.005" value="1.0">
      </div>
      
      <div class="cal-control">
        <label>卡牌高度 (Scale Y): <span id="val-sy">1.0</span></label>
        <input type="range" id="cal-sy" min="0.5" max="1.8" step="0.005" value="1.0">
      </div>

      <div class="cal-control">
        <label>旋轉角度 (Rot Z): <span id="val-rz">0</span>°</label>
        <input type="range" id="cal-rz" min="-45" max="45" step="0.5" value="0">
      </div>

      <div style="display: flex; gap: 8px; margin-top: 5px;">
        <button id="reset-cal-btn">恢復重設</button>
        <button id="save-cal-btn">💾 儲存並關閉</button>
      </div>
    </div>

    <!-- 2. 中間觀鏡視角 -->
    <div class="viewfinder-viewport">
      <div class="macro-button">
        <span class="macro-icon">🌷</span>
      </div>
      <div class="zoom-row">
        <span class="zoom-dot">.5</span>
        <span class="zoom-dot active">1x</span>
        <span class="zoom-dot">2</span>
        <span class="zoom-dot">4</span>
        <span class="zoom-dot">8</span>
      </div>
    </div>

    <!-- 3. 底部黑色面板 -->
    <div class="bottom-panel-ios">
      <div class="shutter-row">
        <div class="ios-shutter-container" id="shutter-btn">
          <div class="ios-shutter-inner"></div>
        </div>
      </div>
      <div class="dock-row">
        <div class="lens-dial">
          <span style="font-size: 8px; transform: scale(0.85); opacity: 0.8;">父 漲</span>
          <span class="dial-red">0.00</span>
        </div>
        <div class="modes-pill">
          <span class="mode-item">錄影</span>
          <span class="mode-item active" id="magic-status">拍照</span>
        </div>
        <div class="flip-button" id="flip-camera-btn">
          <span>🔄</span>
        </div>
      </div>
    </div>
  </div>

  <!-- AR 場景 -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; filterMinCF: 0.005; filterBeta: 10; missTolerance: 15; uiLoading: no; uiError: no; uiScanning: no;" 
    embedded 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights: true" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false"
    light-estimator
  >
    <a-assets>
      <img id="clubs5-mask-texture" src="./clubs_5_mask.png"> 
      <img id="clubs5-normal" src="./clubs_5_normal.png"> 
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-light id="ambient-light" type="ambient" color="#ffffff" intensity="0.8"></a-light>
    <a-light id="dir-light" type="directional" position="1 3 1" color="#ffffff" intensity="1.2"></a-light>

    <a-entity id="card-target" mindar-image-target="targetIndex: 0">
      <!-- 初始參數將會由 JS 自動從記憶體載入 -->
      <a-entity 
        id="magic-card-overlay"
        geometry="primitive: plane; width: 1; height: 1.4" 
        material="shader: standard; src: #clubs5-mask-texture; normalMap: #clubs5-normal; normalScale: 0.1 0.1; roughness: 0.35; metalness: 0.05; transparent: true; alphaTest: 0.5;"
        position="0 -0.35 0" 
        rotation="0 0 0"
        scale="1 1 1"
        visible="true"
      ></a-entity>
    </a-entity>
  </a-scene>

  <script src="app.js"></script>
</body>
</html>
