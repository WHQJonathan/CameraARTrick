<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
  <title>Camera</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-192.png">

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 手動啟動相機解鎖層 -->
  <div id="ios-camera-unlocker">
    <div class="unlock-text">若畫面全黑，請點擊螢幕任意處啟用相機</div>
  </div>

  <!-- iOS 仿真相機介面 -->
  <div id="camera-ui">
    <div class="top-black-bar">
      <div class="recording-dot"></div>
      <div class="top-floating-pill">
        <span class="pill-icon">⚡️<sub style="font-size: 8px;">A</sub></span>
        <span class="pill-icon active-yellow">◎</span>
        <span class="pill-icon">⁙</span>
      </div>
    </div>

    <div class="viewfinder-viewport">
      <div class="macro-button">
        <span class="macro-icon">🌷</span>
      </div>
      <div class="zoom-row">
        <span class="zoom-dot">.5</span>
        <span class="zoom-dot active">1x</span>
        <span class="zoom-dot">2</span>
        <span class="zoom-dot">4</span>
        <span class="zoom-dot">8</span>
      </div>
    </div>

    <div class="bottom-panel-ios">
      <div class="shutter-row">
        <div class="ios-shutter-container" id="shutter-btn">
          <div class="ios-shutter-inner"></div>
        </div>
      </div>
      <div class="dock-row">
        <div class="lens-dial">
          <span style="font-size: 8px; transform: scale(0.85); opacity: 0.8;">父 漲</span>
          <span class="dial-red">0.00</span>
        </div>
        <div class="modes-pill">
          <span class="mode-item">錄影</span>
          <span class="mode-item active" id="magic-status">拍照</span>
        </div>
        <div class="flip-button" id="flip-camera-btn">
          <span>🔄</span>
        </div>
      </div>
    </div>
  </div>

  <!-- AR 場景 (掛載自訂的 light-estimator 組件) -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: no;" 
    embedded 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights: true" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false"
    light-estimator
  >
    <!-- 引入紋理資源與法線貼圖 -->
    <a-assets>
      <img id="clubs5-texture" src="./clubs_5.png"> <!-- 梅花5 乾淨彩色圖 -->
      <img id="clubs5-normal" src="./clubs_5_normal.png"> <!-- 梅花5 的紫藍色法線凹凸圖 -->
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- PBR 物理光影所需的光源：包含環境光與主方向光（模擬天花板燈光） -->
    <a-light id="ambient-light" type="ambient" color="#ffffff" intensity="0.8"></a-light>
    <a-light id="dir-light" type="directional" position="1 3 1" color="#ffffff" intensity="1.2"></a-light>

    <!-- 撲克牌追蹤實體 -->
    <a-entity id="card-target" mindar-image-target="targetIndex: 0">
        <!-- 
        【修正重點】：
        1. 加上 transparent: true; 與 alphaTest: 0.5; 自動消除 PNG 卡牌四周的透明黑色區塊。
        2. 加入 scale="0.9 0.9 1" 屬性將卡牌縮小 (預設縮小 10%)。
            💡 微調指南：
            - 如果梅花 5 依然「太大」：請將 0.9 改小，例如 scale="0.85 0.85 1" 或 scale="0.8 0.8 1"
            - 如果梅花 5 變得「太小」：請將 0.9 改大，例如 scale="0.95 0.95 1" 或 scale="0.98 0.98 1"
        -->
        <a-entity 
        id="magic-card-overlay"
        geometry="primitive: plane; width: 1; height: 1.4" 
        material="shader: standard; src: #clubs5-texture; normalMap: #clubs5-normal; normalScale: 0.1 0.1; roughness: 0.28; metalness: 0.08; transparent: true; alphaTest: 0.5;"
        position="0 0 0" 
        rotation="0 0 0"
        scale="3 1 1.5"
        visible="true"
        ></a-entity>
    </a-entity>
  </a-scene>

  <script src="app.js"></script>
</body>
</html>
